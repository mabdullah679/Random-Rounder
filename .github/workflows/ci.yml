name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JS syntax check
        run: node --check randomRounder.js
      - name: Referenced local files exist
        run: |
          test -f randomRounder.css
          test -f randomRounder.js
          grep -q 'href="randomRounder.css"' randomRounder.html
          grep -q 'src="randomRounder.js"' randomRounder.html
